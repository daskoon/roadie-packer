<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vehicle Cargo Input</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#89cfeb",
                        "background-light": "#f6f7f8",
                        "background-dark": "#121c20",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e292e",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0f171a] dark:text-white transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden pb-24">
<!-- TopAppBar -->
<div class="sticky top-0 z-10 flex items-center bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 pb-2 justify-between border-b border-transparent dark:border-white/5">
<button class="text-[#0f171a] dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h2 class="text-[#0f171a] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Vehicle Dimensions</h2>
</div>
<!-- HeaderImage (Vehicle Visual) -->
<div class="@container px-4 py-3">
<div class="w-full bg-center bg-no-repeat bg-contain flex flex-col justify-end overflow-hidden rounded-xl min-h-[180px] bg-gradient-to-b from-primary/10 to-transparent" data-alt="3D isometric illustration of a delivery van with open cargo doors" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAeZ4Cz4iqQoG_6rVajDy_viY00AnAJYW7myNmUV0vo6fU0jVB71T53RlL7IRm7RRsCShZjU8yEeNbletJLQF80Dmj1eI1le9TIvWN4Kb4nTlGhNwa6SQuPXKbU1qi9hWe6zvq6zk3W7PwGNP3FGO1ccK-rP9pDdteJRTk1m6bwk4AsuczosLMmsYQasxb67fBIIOV-4WsBv6rTGsj7nXzxosnvjYey58as7DQfs_ZM52dPz_6QuoLY-f0L1uRAR-NYyxvhggrM66nM");'>
</div>
</div>
<!-- HeadlineText -->
<div class="flex flex-col px-4 pt-2">
<h1 class="text-[#0f171a] dark:text-white tracking-tight text-[28px] font-bold leading-tight text-left">Set Your Capacity</h1>
</div>
<!-- BodyText -->
<div class="flex flex-col px-4 pb-4 pt-2">
<p class="text-[#538193] dark:text-gray-400 text-base font-normal leading-normal">Enter your vehicle's cargo hold dimensions to ensure a perfect fit for your packages.</p>
</div>
<!-- SegmentedButtons (Unit Toggle) -->
<div class="flex px-4 py-2">
<div class="flex h-12 flex-1 items-center justify-center rounded-xl bg-[#e8eff2] dark:bg-surface-dark p-1">
<label class="group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-sm transition-all duration-200">
<span class="truncate text-sm font-medium leading-normal text-[#538193] group-has-[:checked]:text-[#0f171a] dark:text-gray-400 dark:group-has-[:checked]:text-white">Imperial (in)</span>
<input checked="" class="invisible w-0" name="unit-toggle" type="radio" value="Imperial (in)"/>
</label>
<label class="group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-sm transition-all duration-200">
<span class="truncate text-sm font-medium leading-normal text-[#538193] group-has-[:checked]:text-[#0f171a] dark:text-gray-400 dark:group-has-[:checked]:text-white">Metric (cm)</span>
<input class="invisible w-0" name="unit-toggle" type="radio" value="Metric (cm)"/>
</label>
</div>
</div>
<!-- Dimension Input Cards -->
<div class="flex flex-col gap-4 px-4 py-4">
<!-- Length Input -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-transparent focus-within:border-primary/50 transition-colors">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-2">
<div class="flex items-center justify-center size-8 rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-xl">straighten</span>
</div>
<label class="text-sm font-medium text-[#538193] dark:text-gray-400" for="length">Length (Depth)</label>
</div>
</div>
<div class="relative flex items-center">
<input class="block w-full border-0 bg-transparent p-0 text-3xl font-bold text-[#0f171a] dark:text-white placeholder:text-gray-300 focus:ring-0" id="length" placeholder="0" type="number"/>
<span class="text-lg font-medium text-[#538193] dark:text-gray-500 ml-2">in</span>
</div>
</div>
<!-- Width Input -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-transparent focus-within:border-primary/50 transition-colors">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-2">
<div class="flex items-center justify-center size-8 rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-xl">width_full</span> <!-- closest to visual helper for width -->
</div>
<label class="text-sm font-medium text-[#538193] dark:text-gray-400" for="width">Width (Side to side)</label>
</div>
</div>
<div class="relative flex items-center">
<input class="block w-full border-0 bg-transparent p-0 text-3xl font-bold text-[#0f171a] dark:text-white placeholder:text-gray-300 focus:ring-0" id="width" placeholder="0" type="number"/>
<span class="text-lg font-medium text-[#538193] dark:text-gray-500 ml-2">in</span>
</div>
</div>
<!-- Height Input -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-transparent focus-within:border-primary/50 transition-colors">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-2">
<div class="flex items-center justify-center size-8 rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-xl">height</span>
</div>
<label class="text-sm font-medium text-[#538193] dark:text-gray-400" for="height">Height (Floor to ceiling)</label>
</div>
</div>
<div class="relative flex items-center">
<input class="block w-full border-0 bg-transparent p-0 text-3xl font-bold text-[#0f171a] dark:text-white placeholder:text-gray-300 focus:ring-0" id="height" placeholder="0" type="number"/>
<span class="text-lg font-medium text-[#538193] dark:text-gray-500 ml-2">in</span>
</div>
</div>
</div>
<!-- Scan VIN Option -->
<div class="flex justify-center pb-6">
<button class="flex items-center gap-2 px-4 py-2 rounded-lg text-primary hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined">qr_code_scanner</span>
<span class="text-sm font-bold tracking-wide">Scan VIN to Autofill</span>
</button>
</div>
<!-- Floating/Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-gray-100 dark:border-white/5">
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-[#7bc0dc] text-[#0f171a] font-bold text-lg rounded-xl py-4 shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined">deployed_code</span>
                Visualize Cargo Space
            </button>
</div>
</div>
</body></html>
